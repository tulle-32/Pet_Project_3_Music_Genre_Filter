# Непрерывная интеграция (CI) — первый пайплайн проекта.
#
# Что это вообще такое. Каждый раз, когда код попадает на GitHub (пуш
# в любую ветку или открытие/обновление pull request), GitHub сам
# поднимает чистую виртуальную машину, кладёт туда наш код и выполняет
# шаги, описанные ниже. Ни один из этих шагов не выполняется у тебя
# на компьютере — только на серверах GitHub. Цель простая: узнать, что
# код не собирается или тест не проходит, сразу и на видном месте —
# зелёная или красная галочка рядом с коммитом, — а не через неделю,
# когда уже забыл, что менял.
#
# Файл специально маленький. Задача v0.5.0 — не "самый мощный пайплайн
# из возможных", а "понять на своих руках, что такое CI, целиком, от
# первой до последней строчки". Всё, что здесь есть, можно прочитать
# и понять за один присест: собери, проверь глазами (vet, gofmt),
# прогони тесты. Более серьёзные линтеры (например golangci-lint,
# который тащит несколько десятков отдельных проверок) — осознанное
# решение отложить, см. docs/DECISIONS.md, Р-012.

name: CI

# on: описывает, СОБЫТИЯ ПРИ КАКИХ этот файл вообще запускается.
on:
  # Любой push в любую ветку. Не только main — чтобы видеть красное
  # ещё до того, как сломанный код попадёт в основную ветку.
  push:
  # Открытие или обновление pull request. Полезно, когда в проекте
  # появится больше одной ветки одновременно — сейчас, при работе
  # в одиночку в main, это в основном задел на будущее.
  pull_request:

# jobs: одна или несколько независимых работ. У нас пока одна —
# "собери и проверь". Каждая работа получает свою чистую машину.
jobs:
  build-and-test:
    # runs-on выбирает, на какой машине выполнять шаги. ubuntu-latest —
    # самый быстрый и самый дешёвый вариант в GitHub Actions, и он же
    # ближе всего к тому, где реально будет крутиться Docker-образ
    # в v1.0.0 — в контейнерах Linux, а не Windows.
    runs-on: ubuntu-latest

    # steps выполняются по порядку, сверху вниз. Если любой шаг
    # завершится с ошибкой, все следующие шаги пропускаются, и вся
    # работа помечается красной. Это и есть смысл CI: одна ошибка —
    # весь пайплайн становится заметно красным, а не тихо продолжает.
    steps:
      # actions/checkout — готовый чужой шаг ("экшен"), который
      # скачивает наш репозиторий в рабочую папку виртуальной машины.
      # Без этого шага код GitHub'у взять неоткуда: виртуальная машина
      # стартует пустой.
      - name: Скачать код репозитория
        uses: actions/checkout@v4

      # actions/setup-go — ставит на машину компилятор Go нужной
      # версии. go-version-file читает версию прямо из go.mod (сейчас
      # там "go 1.24"), поэтому версия компилятора в CI и на твоём
      # компьютере гарантированно совпадают: одна правка go.mod —
      # и обновится сразу и локально, и здесь.
      #
      # cache: true включает кэширование скачанных Go-модулей между
      # запусками пайплайна. Без кэша каждый запуск заново тянул бы
      # из интернета pgx, goose и остальные зависимости — лишние
      # минуты на каждый пуш.
      - name: Установить Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # go mod download подтягивает зависимости из go.mod/go.sum
      # ДО сборки, отдельным шагом. Не обязательно (go build сделал бы
      # это сам), но так в логе пайплайна видно отдельной строкой,
      # сколько времени ушло именно на скачивание, а не намешано
      # в сборку.
      - name: Скачать зависимости
        run: go mod download

      # gofmt — форматирование кода, часть самого Go, а не отдельный
      # линтер. "gofmt -l" не переписывает файлы, а печатает список
      # тех, что отформатированы не по стандарту. В обычном режиме
      # список пустой, и шаг просто завершается успешно.
      #
      # Хитрость в следующей строке: если бы мы просто вызвали
      # "gofmt -l .", шаг оказался бы зелёным ДАЖЕ если файлы кривые —
      # gofmt сама по себе не возвращает код ошибки, она только
      # печатает список. Поэтому список загоняется в переменную,
      # и если она непустая — шаг явно проваливается через exit 1.
      # Без этой хитрости CI не заметил бы неотформатированный код.
      - name: Проверить форматирование (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Эти файлы не отформатированы (запусти: gofmt -w .):"
            echo "$unformatted"
            exit 1
          fi

      # go vet — статический анализ из стандартной поставки Go.
      # Не про стиль (это работа gofmt), а про вещи, которые почти
      # наверняка баги: забытый %s в Printf, недостижимый код,
      # неправильное сравнение и подобное. Не заменяет тесты, но
      # ловит ошибки, для которых даже запускать код не нужно.
      - name: Статический анализ (go vet)
        run: go vet ./...

      # Сборка обеих программ. Если где-то опечатка в имени функции
      # или забытый импорт — упадёт здесь, с точным указанием файла
      # и строки. ./... значит "все пакеты модуля", а не только
      # текущая папка.
      - name: Собрать проект
        run: go build ./...

      # Запуск всех тестов проекта. -v печатает каждый тест по имени
      # (PASS/FAIL), чтобы в логе GitHub было сразу видно, что именно
      # проверялось, а не только итоговую строку "ok" или "FAIL".
      #
      # Тестов на реальной базе PostgreSQL здесь пока нет — только
      # internal/normalize, который ни в сеть, ни в базу не ходит.
      # Когда появятся тесты, которым нужна живая база (например,
      # для internal/storage), в этот файл добавится блок "services:"
      # с контейнером PostgreSQL — GitHub Actions умеет поднимать
      # и его тоже, тем же способом, что docker-compose поднимает
      # базу у тебя локально.
      - name: Запустить тесты
        run: go test ./... -v
