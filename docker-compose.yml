# =============================================================================
# Локальное окружение для разработки.
#
# Что здесь есть: PostgreSQL. И всё. Само приложение на Go запускается
# напрямую командой "go run ./cmd/server" — так пересборка занимает секунду,
# а не полминуты на упаковку образа. В контейнер приложение переедет
# в v1.0.0, когда появится Dockerfile.
#
# Команды, которые понадобятся:
#   docker compose up -d        поднять базу в фоне
#   docker compose ps           посмотреть, что запущено и здорово ли оно
#   docker compose logs -f      смотреть журнал базы вживую
#   docker compose stop         остановить, данные останутся
#   docker compose down         остановить и удалить контейнер, данные останутся
#   docker compose down -v      ОСТОРОЖНО: удалит ещё и том с данными
#
# Compose сам читает файл .env из этой же папки, поэтому переменные ниже
# берутся оттуда же, откуда их берёт приложение. Один источник правды.
# =============================================================================

services:
  postgres:
    # Версия зафиксирована намеренно. Написать "postgres:latest" — значит
    # однажды прийти утром, обновить образ и обнаружить, что мажорная версия
    # сменилась, а формат данных на диске несовместим. Обновляться нужно
    # осознанно, а не случайно.
    image: postgres:17-alpine

    # Имя контейнера с префиксом проекта — чтобы в "docker ps" среди прочих
    # контейнеров было сразу видно, чей он.
    container_name: mgf-postgres

    # restart: unless-stopped означает "поднимай обратно после перезагрузки
    # компьютера, но не поднимай, если я остановил его руками".
    restart: unless-stopped

    environment:
      # Синтаксис ${ИМЯ} берёт значение из файла .env.
      # Если переменной там нет, compose ругнётся при запуске — и хорошо,
      # лучше узнать сразу, чем гадать, почему база не пускает.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      # Локаль и кодировка. Кириллицы в данных будет много: имена
      # исполнителей, названия треков. UTF-8 здесь не роскошь.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"

    ports:
      # Формат "внешний:внутренний". Слева порт на твоём компьютере,
      # справа порт внутри контейнера. Внешний берём из .env, чтобы
      # можно было увести базу на другой порт, если 5432 уже занят
      # какой-нибудь ранее поставленной PostgreSQL.
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      # Именованный том. Без этой строки все данные жили бы внутри
      # контейнера и умирали вместе с ним при каждом "docker compose down".
      # С томом данные лежат отдельно и переживают пересоздание контейнера.
      - mgf-postgres-data:/var/lib/postgresql/data

    healthcheck:
      # Docker сам периодически спрашивает контейнер "ты живой?".
      # pg_isready — штатная утилита PostgreSQL, отвечает именно на это.
      # Результат видно в "docker compose ps" в колонке STATUS: healthy
      # или starting. Полезно: контейнер может быть запущен, но база внутри
      # него ещё инициализируется и запросы не принимает.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s      # как часто спрашивать
      timeout: 3s       # сколько ждать ответа
      retries: 10       # сколько неудач подряд считать за "больной"
      start_period: 10s # не считать неудачи в первые 10 секунд после старта

volumes:
  # Объявление именованного тома. Docker создаст его сам при первом запуске.
  # Посмотреть список: docker volume ls
  # Удалить насовсем:  docker compose down -v
  mgf-postgres-data:
    name: mgf-postgres-data
